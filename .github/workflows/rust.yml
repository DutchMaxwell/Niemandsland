name: Rust (advisory)

on:
  # Path filter (CISPEED-RUSTPATH): the six jobs below read ONLY the paths listed here
  # (measured 04.11.2026: every non-core file the jobs open, with its access time reset
  # to 2000 beforehand, on a clean clone running clippy_gate.sh, cargo test nml-core,
  # cargo build nml-core-godot, cargo check + maturin build + pytest nml-core-py and
  # pytest tools with the CI environment: no HOME lists, no Godot, no onnxruntime).
  # Not read at all: scripts/**, scenes/**, shaders/**, docs/**, addons/**, any .gd file.
  #   core/**                                   the crates, Cargo.toml/Cargo.lock, python tests + fixtures
  #   rust-toolchain.toml                       the pinned rustc
  #   .github/workflows/rust.yml                this file
  #   tools/**                                  pytest tools (recursive), clippy_gate.sh + clippy_baseline.txt,
  #                                             epoch_gate_check.py, modules the python tests import
  #   assets/solo/**                            rules/spells mechanics, missions, deployments, brains
  #   assets/model_manifest.json                read by list_to_profile.py
  #   data/**                                   encoder_rule_vocab_v1.json
  #   test/fixtures/**                          position/sight/policy parity fixtures, card lists
  #   farm/patches/preserve-core-identity.patch only with NML_FARM_IDENTITY_PATCH=1 (never set in CI)
  # test/shard_weights.json and the *_test.gd file list are read by tools/shard_assign_test.py;
  # that guard runs on every PR in build.yml ("Shards cover every suite"), so they are NOT listed.
  # workflow_dispatch and workflow_call (release gate in build.yml) ignore paths and always run.
  # A new path the jobs start reading MUST be added here; re-measure the way the PR body says.
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/rust.yml'
      - 'tools/**'
      - 'assets/solo/**'
      - 'assets/model_manifest.json'
      - 'data/**'
      - 'test/fixtures/**'
      - 'farm/patches/preserve-core-identity.patch'
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/rust.yml'
      - 'tools/**'
      - 'assets/solo/**'
      - 'assets/model_manifest.json'
      - 'data/**'
      - 'test/fixtures/**'
      - 'farm/patches/preserve-core-identity.patch'
  workflow_dispatch:
  # Reusable: build.yml calls this workflow as the release gate's Rust check on
  # tag pushes (rust.yml itself has no tag trigger — tags don't touch main/PR).
  workflow_call:

concurrency:
  # PRs: one group per branch — a newer push cancels the older run, the head is
  # what gets merged. Branch pushes (main): ONE group, cancel-in-progress stays off — a
  # run that is already running is never killed, but a newer main push REPLACES the one
  # run still waiting behind it (GitHub keeps one pending run per group), so a burst of
  # merge commits queues one run, for the tip tree. Tag pushes and workflow_dispatch: one
  # group PER COMMIT, nothing is ever replaced (release gate).
  # Measured 2026-09-13: five main runs were cancelled exactly that way in one
  # evening (70dd886b, 9a5dea52, 86ec1fce, 95f6b397, f8741028). The newest main
  # commit with a completed green build run was four merges behind the tip, and
  # 70dd886b — the merge carrying the rule-bag widening 8 -> 17 together with the
  # re-minted golden fixture — had no gdUnit verdict at all. A green board that no
  # run stands behind. Sharding the gdUnit job (#923) is what makes one run per
  # main commit affordable.
  group: rust-${{ github.event_name == 'pull_request' && github.ref || (github.event_name == 'push' && github.ref_type == 'branch' && 'main-push') || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The old single job ("Build and test core crates") is split into parallel jobs
  # that run the same commands. The gate job at the bottom keeps that exact name
  # and fails unless every split job passed, so the required-check name is stable.
  clippy:
    name: Clippy and epoch gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        # rust-toolchain.toml at the repo root pins the exact rustc; this step
        # only makes sure rustup is present so that pin can be honoured.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Epoch gate — a rules epoch bump must prove BOTH legs
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The PR diff comes from the API, not from git: the checkout is shallow and a
          # three-dot diff needs a merge base the runner does not have.
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" \
            -H "Accept: application/vnd.github.v3.diff" > /tmp/pr.diff
          wc -l < /tmp/pr.diff
          python3 tools/epoch_gate_check.py /tmp/pr.diff

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # F7: the three core crates are ONE Cargo workspace now — one
          # workspace root, one target dir. Cache the workspace, not each crate.
          workspaces: core
          shared-key: core-clippy

      - name: Clippy — no NEW findings
        # Differential on purpose, never `-D warnings`: main carries findings
        # whose "fix" would change parity-critical constants (see the header of
        # tools/clippy_gate.sh). This fails only when a lint code's count rises
        # or a new code appears, and it refuses to pass on an empty measurement.
        run: bash tools/clippy_gate.sh

  core-tests:
    name: Test nml-core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        # rust-toolchain.toml at the repo root pins the exact rustc; this step
        # only makes sure rustup is present so that pin can be honoured.
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # F7: the three core crates are ONE Cargo workspace now — one
          # workspace root, one target dir. Cache the workspace, not each crate.
          workspaces: core
          shared-key: core-release

      - name: Test nml-core
        # Tests build on the cheap release profile: fat LTO + one codegen unit (core/Cargo.toml) would add ~10 min of
        # test-binary linking for nothing. Shipped artifacts keep fat LTO; its parity is proven by byte-identical games.
        run: cargo test --manifest-path core/nml-core/Cargo.toml --release
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

  core-ignored:
    name: Fixture-gated nml-core tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        # rust-toolchain.toml at the repo root pins the exact rustc; this step
        # only makes sure rustup is present so that pin can be honoured.
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # F7: the three core crates are ONE Cargo workspace now — one
          # workspace root, one target dir. Cache the workspace, not each crate.
          workspaces: core
          shared-key: core-release

      - name: Fixture-gated tests
        # Private fixtures are not in the repo: run the ignored policy tests
        # only when they are staged into the workspace — never silently green.
        if: hashFiles('selfplay_out/**') != '' && hashFiles('netlab/nets/policy_v1.json') != ''
        run: cargo test --manifest-path core/nml-core/Cargo.toml --release -- --ignored
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"  # same cheap test profile as the job above (shared rust-cache key)
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          NML_POLICY_DUMP: selfplay_out/policy_rows_v1/dumps/qbg_ref_all.jsonl
          NML_POLICY_CORPUS: selfplay_out/qbg_ref
          NML_POLICY_NET: netlab/nets/policy_v1.json

  godot-build:
    name: Build nml-core-godot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        # rust-toolchain.toml at the repo root pins the exact rustc; this step
        # only makes sure rustup is present so that pin can be honoured.
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # F7: the three core crates are ONE Cargo workspace now — one
          # workspace root, one target dir. Cache the workspace, not each crate.
          workspaces: core
          shared-key: core-godot

      - name: Build nml-core-godot
        run: cargo build --manifest-path core/nml-core-godot/Cargo.toml --release

  py:
    name: nml-core-py build, pytest and tools pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        # rust-toolchain.toml at the repo root pins the exact rustc; this step
        # only makes sure rustup is present so that pin can be honoured.
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # F7: the three core crates are ONE Cargo workspace now — one
          # workspace root, one target dir. Cache the workspace, not each crate.
          workspaces: core
          shared-key: core-py

      - name: Check nml-core-py
        run: cargo check --manifest-path core/nml-core-py/Cargo.toml
        env:
          PYO3_PYTHON: python3

      - name: Install Python build/test deps
        run: pip install maturin pytest numpy pytest-timeout

      - name: Build nml-core-py wheel
        run: NML_BUILD_COMMIT=$GITHUB_SHA maturin build --release -m core/nml-core-py/Cargo.toml -o dist

      - name: Install nml-core-py wheel
        run: pip install dist/*.whl

      - name: Run nml-core-py pytest suite
        run: PYTHONPATH=core/nml-core-py/python python3 -m pytest core/nml-core-py/tests/python -q -x --timeout 900

      - name: tools pytest
        # The tools/ suite has no CI home otherwise: the merge-gate checker
        # (#934/#938), the arena re-scorer (#905) and the ctex manifest merger
        # were tested only when a human remembered. pytest/pytest-timeout are
        # installed by the "Install Python build/test deps" step above.
        # Known-broken tests are skipped by marker in tools/conftest.py with
        # the reason in the skip string.
        run: python3 -m pytest tools -q --timeout 600

      - name: needs_lists Python subset (only if the private fixtures are staged)
        # The suite above silently @needs_lists-skips 62 tests whenever the terrain
        # bank + 1000pt army lists are absent -- true for every public PR today, so
        # this gap has never actually run here (farm finding 05.09.). Mirrors the
        # "Fixture-gated tests" Rust step above: named and skip-if-absent, never a
        # silent green. Home-relative because the tests read `~/...`, same as the
        # farm; point HOME at the checkout so a maintainer can stage fixtures the
        # same repo-relative way the Rust step already does.
        #
        # Picked 3 tests that assert STRUCTURE (key presence, a numeric constant,
        # digest INEQUALITY) and never a hardcoded digest string: the same 05.09.
        # farm run found 11 other @needs_lists tests whose pinned digest does not
        # reproduce even on an unmodified historical commit rebuilt on today's farm
        # boxes (root cause open, not the rule changes, not epoch, not randomness --
        # see the farm failure notes). A hardcoded-digest
        # test here would make this step exactly as fragile; these three are not.
        if: hashFiles('selfplay_out/terrain_bank/**') != '' && hashFiles('farm/ai_lists/**') != ''
        env:
          HOME: ${{ github.workspace }}
        run: >
          PYTHONPATH=core/nml-core-py/python python3 -m pytest -q --timeout 900
          core/nml-core-py/tests/python/test_rules_epoch_stamp.py
          core/nml-core-py/tests/python/test_mass_fast.py::test_the_worker_passes_the_fidelity_knobs_into_the_game

  rust:
    # Stable required-check name: unchanged from the pre-split single job.
    name: Build and test core crates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [clippy, core-tests, core-ignored, godot-build, py]
    if: ${{ always() }}
    steps:
      - name: Every split job must have succeeded (core-ignored may skip, its fixtures are private)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          IGNORED: ${{ needs.core-ignored.result }}
        run: |
          echo "split job results: $RESULTS"
          for r in ${{ needs.clippy.result }} ${{ needs.core-tests.result }} ${{ needs.godot-build.result }} ${{ needs.py.result }}; do
            [ "$r" = "success" ] || { echo "::error::a split job finished as $r"; exit 1; }
          done
          [ "$IGNORED" = "success" ] || [ "$IGNORED" = "skipped" ] || { echo "::error::core-ignored finished as $IGNORED"; exit 1; }
