name: Rust (advisory)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Reusable: build.yml calls this workflow as the release gate's Rust check on
  # tag pushes (rust.yml itself has no tag trigger — tags don't touch main/PR).
  workflow_call:

concurrency:
  # PRs: one group per branch — a newer push cancels the older run, the head is
  # what gets merged. push / workflow_dispatch: one group PER COMMIT, so a merge
  # never cancels the queued run of the merge before it.
  # Measured 2026-09-13: five main runs were cancelled exactly that way in one
  # evening (70dd886b, 9a5dea52, 86ec1fce, 95f6b397, f8741028). The newest main
  # commit with a completed green build run was four merges behind the tip, and
  # 70dd886b — the merge carrying the rule-bag widening 8 -> 17 together with the
  # re-minted golden fixture — had no gdUnit verdict at all. A green board that no
  # run stands behind. Sharding the gdUnit job (#923) is what makes one run per
  # main commit affordable.
  group: rust-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Build and test core crates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Blocking since 2026-09-03: the core crates drive the training corpus,
    # the fidelity gates and the promoted AI player, so a red build or test
    # here is a red workflow (external review 03.09., item 2).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        # rust-toolchain.toml at the repo root pins the exact rustc; this step
        # only makes sure rustup is present so that pin can be honoured.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Epoch gate — a rules epoch bump must prove BOTH legs
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The PR diff comes from the API, not from git: the checkout is shallow and a
          # three-dot diff needs a merge base the runner does not have.
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" \
            -H "Accept: application/vnd.github.v3.diff" > /tmp/pr.diff
          wc -l < /tmp/pr.diff
          python3 tools/epoch_gate_check.py /tmp/pr.diff

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # F7: the three core crates are ONE Cargo workspace now — one
          # workspace root, one target dir. Cache the workspace, not each crate.
          workspaces: core

      - name: Clippy — no NEW findings
        # Differential on purpose, never `-D warnings`: main carries findings
        # whose "fix" would change parity-critical constants (see the header of
        # tools/clippy_gate.sh). This fails only when a lint code's count rises
        # or a new code appears, and it refuses to pass on an empty measurement.
        run: bash tools/clippy_gate.sh

      - name: Test nml-core
        run: cargo test --manifest-path core/nml-core/Cargo.toml --release

      - name: Fixture-gated tests
        # Private fixtures are not in the repo: run the ignored policy tests
        # only when they are staged into the workspace — never silently green.
        if: hashFiles('selfplay_out/**') != '' && hashFiles('nml-mission/netlab/nets/policy_v1.json') != ''
        run: cargo test --manifest-path core/nml-core/Cargo.toml --release -- --ignored
        env:
          NML_POLICY_DUMP: selfplay_out/policy_rows_v1/dumps/qbg_ref_all.jsonl
          NML_POLICY_CORPUS: selfplay_out/qbg_ref
          NML_POLICY_NET: nml-mission/netlab/nets/policy_v1.json

      - name: Build nml-core-godot
        run: cargo build --manifest-path core/nml-core-godot/Cargo.toml --release

      - name: Check nml-core-py
        run: cargo check --manifest-path core/nml-core-py/Cargo.toml
        env:
          PYO3_PYTHON: python3

      - name: Install Python build/test deps
        run: pip install maturin pytest numpy pytest-timeout

      - name: Build nml-core-py wheel
        run: NML_BUILD_COMMIT=$GITHUB_SHA maturin build --release -m core/nml-core-py/Cargo.toml -o dist

      - name: Install nml-core-py wheel
        run: pip install dist/*.whl

      - name: Run nml-core-py pytest suite
        run: PYTHONPATH=core/nml-core-py/python python3 -m pytest core/nml-core-py/tests/python -q -x --timeout 900

      - name: tools pytest (wiring proof — RED, real invocation follows)
        run: python3 -m pytest tools/does_not_exist.py -q --timeout 600

      - name: needs_lists Python subset (only if the private fixtures are staged)
        # The suite above silently @needs_lists-skips 62 tests whenever the terrain
        # bank + 1000pt army lists are absent -- true for every public PR today, so
        # this gap has never actually run here (farm finding 05.09.). Mirrors the
        # "Fixture-gated tests" Rust step above: named and skip-if-absent, never a
        # silent green. Home-relative because the tests read `~/...`, same as the
        # farm; point HOME at the checkout so a maintainer can stage fixtures the
        # same repo-relative way the Rust step already does.
        #
        # Picked 3 tests that assert STRUCTURE (key presence, a numeric constant,
        # digest INEQUALITY) and never a hardcoded digest string: the same 05.09.
        # farm run found 11 other @needs_lists tests whose pinned digest does not
        # reproduce even on an unmodified historical commit rebuilt on today's farm
        # boxes (root cause open, not the rule changes, not epoch, not randomness --
        # see /root/w3_known_py_failures.txt on the wave-3 boxes). A hardcoded-digest
        # test here would make this step exactly as fragile; these three are not.
        if: hashFiles('selfplay_out/terrain_bank/**') != '' && hashFiles('nml-mission/farm/ai_lists/**') != ''
        env:
          HOME: ${{ github.workspace }}
        run: >
          PYTHONPATH=core/nml-core-py/python python3 -m pytest -q --timeout 900
          core/nml-core-py/tests/python/test_rules_epoch_stamp.py
          core/nml-core-py/tests/python/test_mass_fast.py::test_the_worker_passes_the_fidelity_knobs_into_the_game
