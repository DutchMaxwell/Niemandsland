name: Rust (advisory)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rust:
    name: Build and test core crates
    runs-on: ubuntu-latest
    # Advisory only: the crates aren't wired into the release build yet, so a
    # failure here must not block main. Flip once they ship (NML-1073 R3).
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core/nml-core
            core/nml-core-godot
            core/nml-core-py

      - name: Test nml-core
        run: cargo test --manifest-path core/nml-core/Cargo.toml --release

      - name: Fixture-gated tests
        # Private fixtures are not in the repo: run the ignored policy tests
        # only when they are staged into the workspace — never silently green.
        if: hashFiles('selfplay_out/**') != '' && hashFiles('nml-mission/netlab/nets/policy_v1.json') != ''
        run: cargo test --manifest-path core/nml-core/Cargo.toml --release -- --ignored
        env:
          NML_POLICY_DUMP: selfplay_out/policy_rows_v1/dumps/qbg_ref_all.jsonl
          NML_POLICY_CORPUS: selfplay_out/qbg_ref
          NML_POLICY_NET: nml-mission/netlab/nets/policy_v1.json

      - name: Build nml-core-godot
        run: cargo build --manifest-path core/nml-core-godot/Cargo.toml --release

      - name: Check nml-core-py
        run: cargo check --manifest-path core/nml-core-py/Cargo.toml
        env:
          PYO3_PYTHON: python3

      - name: Install Python build/test deps
        run: pip install maturin pytest numpy pytest-timeout

      - name: Build nml-core-py wheel
        run: maturin build --release -m core/nml-core-py/Cargo.toml -o dist

      - name: Install nml-core-py wheel
        run: pip install dist/*.whl

      - name: Run nml-core-py pytest suite
        run: PYTHONPATH=core/nml-core-py/python python3 -m pytest core/nml-core-py/tests/python -q -x --timeout 900
