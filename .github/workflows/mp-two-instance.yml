# #675 item 3: the two-instance multiplayer regression suite (test/mp/run_two_instance.py)
# runs two real headless Godot peers against a local relay. Deliberately its OWN job and
# deliberately ADVISORY (not on the required-checks list): a real-peer test can flap on
# runner hiccups, and a red advisory job is visible without blocking merges.
name: MP two-instance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  # PRs: one group per branch — a newer push cancels the older run, the head is
  # what gets merged. push / workflow_dispatch: one group PER COMMIT, so a merge
  # never cancels the queued run of the merge before it.
  # Measured 2026-09-13: five main runs were cancelled exactly that way in one
  # evening (70dd886b, 9a5dea52, 86ec1fce, 95f6b397, f8741028). The newest main
  # commit with a completed green build run was four merges behind the tip, and
  # 70dd886b — the merge carrying the rule-bag widening 8 -> 17 together with the
  # re-minted golden fixture — had no gdUnit verdict at all. A green board that no
  # run stands behind. Sharding the gdUnit job (#923) is what makes one run per
  # main commit affordable.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: "4.6"

jobs:
  # The peers must run WITH the core: since 0.3.16 the one-core activation flow is the default, and
  # CoreActivation.applies() is false without NmlCore, so a core-less run would silently test the old flow only
  # (the first CI run of the flag flip failed on exactly that gap). Same build as the gdUnit lane's.
  core-linux:
    name: Build core for the MP job
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build core extension (NmlCore)
        uses: ./.github/actions/build-core-extension
        with:
          target: linux
          debug-symbols: "false"
          cache-shared-key: export-linux

      - name: Upload the core library for the MP job
        uses: actions/upload-artifact@v4
        with:
          name: nml-core-linux-mp
          path: core/target/release/libnml_core_godot.so
          retention-days: 1
          if-no-files-found: error

  mp-two-instance:
    name: Two-instance multiplayer regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: core-linux
    # Draft PRs skip this advisory suite; it runs once the PR is marked ready (30.10., runner queue).
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the core library (Build core for the MP job)
        uses: actions/download-artifact@v4
        with:
          name: nml-core-linux-mp
          path: core/target/release

      - name: Install the core extension manifest
        run: touch core/target/.gdignore && bash core/install_gdextension.sh && test -f core/nml_core.gdextension

      - name: Setup Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install relay requirements
        run: pip install -r relay/requirements.txt

      # Fresh checkouts fail without a prior import ("Parse Error: Identifier "UiMotion"
      # not declared") — the editor import generates .godot/ first.
      - name: Import project (generates .godot/, compile-check)
        run: godot --headless --editor --quit --path .

      # The peers must have NmlCore: fail here, before the long run, when the class is absent.
      - name: Gate - NmlCore loads in the MP job
        run: |
          godot --headless --path . -s res://tools/core_dormant_check.gd 2>&1 | tee /tmp/core_load.log
          python3 - <<'PY'
          import json, sys
          lines = [l for l in open("/tmp/core_load.log") if "NML_DORMANT_CHECK " in l]
          data = json.loads(lines[0].split("NML_DORMANT_CHECK ", 1)[1]) if lines else {}
          if data.get("class_present") is not True:
              print("::error::NmlCore did not load in the MP job")
              sys.exit(1)
          print("OK: NmlCore loaded in the MP job (class_present True)")
          PY

      # --include-one-core: the default-ON activation flow in an agreed Automatic room (digest check, planted desync, correction).
      # --require-core: the run also fails when a peer log does not say "core: NmlCore loaded".
      - name: Run two-instance multiplayer regressions
        run: python test/mp/run_two_instance.py --godot godot --include-rules-online --include-link-cut --include-one-core --require-core --run-dir reports/mp-two-instance

      - name: Upload multiplayer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mp-two-instance
          path: reports/mp-two-instance
