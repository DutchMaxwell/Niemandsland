name: Build and Export

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    # ready_for_review: a draft that turns ready gets its full run (exports + MP) at that moment.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  # PRs: one group per branch — a newer push cancels the older run, the head is
  # what gets merged. Branch pushes (main): ONE group, cancel-in-progress stays off — a
  # run that is already running is never killed, but a newer main push REPLACES the one
  # run still waiting behind it (GitHub keeps one pending run per group), so a burst of
  # merge commits queues one run, for the tip tree. Tag pushes and workflow_dispatch: one
  # group PER COMMIT, nothing is ever replaced (release gate).
  # Measured 2026-09-13: five main runs were cancelled exactly that way in one
  # evening (70dd886b, 9a5dea52, 86ec1fce, 95f6b397, f8741028). The newest main
  # commit with a completed green build run was four merges behind the tip, and
  # 70dd886b — the merge carrying the rule-bag widening 8 -> 17 together with the
  # re-minted golden fixture — had no gdUnit verdict at all. A green board that no
  # run stands behind. Sharding the gdUnit job (#923) is what makes one run per
  # main commit affordable.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || (github.event_name == 'push' && github.ref_type == 'branch' && 'main-push') || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: "4.6"
  EXPORT_NAME: Niemandsland
  # CI must not re-download the live model library on every run. The ~1 MB live manifest was fetched
  # on every real-scene boot (measured 107 fetches in one CI run); with this set the game keeps the
  # bundled assets/model_manifest.json (the offline fixture) and skips the CDN entirely. The blob
  # cache below then makes warm runs download 0 model blobs too.
  NML_SKIP_REMOTE_MANIFEST: "1"

jobs:
  # Fast lane: a PR that only touches tools/*.py (root tools) or docs/** cannot affect the
  # Godot test/export jobs. A core/** change is NOT fast lane: the test shards load the core
  # (one-core P1, step 6), so a Rust change can break them. Runs on every trigger (cheap) so its output is always available; the
  # gated jobs below fall back to running whenever the event isn't a pull_request, so
  # push/tag/workflow_dispatch (the main-branch and release path) always run in full.
  changes:
    name: Detect fast-lane paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      not_core_only: ${{ steps.filter.outputs.not_core_only }}
      macos_relevant: ${{ steps.macos_filter.outputs.macos_relevant }}
      shard_count: ${{ steps.shards.outputs.shard_count }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      # THE one place that decides how many gdUnit4 shards exist. The test matrix, the
      # shard assignment (tools/shard_assign.py) in the test job and in the shards-coverage guard
      # all read these two outputs, so they cannot drift apart.
      - name: Shard count (single source)
        id: shards
        run: |
          COUNT=12
          echo "shard_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "shards=$(python3 -c "import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$COUNT")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: 'every'
          # Negation-only filter: with `every`, a changed file matches when it falls
          # outside BOTH tools/*.py and docs/**. (The name is historic: core/** left the fast lane.)
          filters: |
            not_core_only:
              - '!tools/*.py'
              - '!docs/**'
      # The macOS core job (export-macos) is the only macos-* runner leg, so a pull request runs it
      # only when it can change what that job builds or proves; every push to main and every tag
      # runs it regardless. Default quantifier (`some`): any matching path counts.
      - uses: dorny/paths-filter@v3
        id: macos_filter
        with:
          filters: |
            macos_relevant:
              - 'core/**'
              - '.github/**'
              - 'export_presets.cfg'
              - 'tools/core_ship_probe.*'
              - 'tools/assert_ship_probe.py'
              - 'scripts/solo/**'
              - 'assets/solo/brains/**'

  # Builds the Rust core once per run for the test shards, which load it (one-core P1, step 5).
  # Shares the export-linux rust cache entry instead of adding a second ~1 GB one; no debug-symbol
  # artifact, so it never collides with export-linux's nml-core-debug-<build-id> upload.
  core-linux:
    name: Build core for tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.not_core_only == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build core extension (NmlCore)
        uses: ./.github/actions/build-core-extension
        with:
          target: linux
          debug-symbols: "false"
          cache-shared-key: export-linux

      - name: Upload the core library for the test shards
        uses: actions/upload-artifact@v4
        with:
          name: nml-core-linux-test
          path: core/target/release/libnml_core_godot.so
          retention-days: 1
          if-no-files-found: error

  # The nml_core python module for the doctrine twin cases in test/objective_layout_test.gd, which
  # run it through NML_DOCTRINE_PYO3_PYTHON. Reads rust.yml's core-py rust cache and never saves one.
  # The wheel is not abi3: this job and the shards pin the same Python minor.
  core-py-linux:
    name: Build nml_core python for tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.not_core_only == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python (same minor as the shards)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo (read only, rust.yml's core-py entry)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          shared-key: core-py
          save-if: false
      - name: Build the nml_core wheel
        run: |
          pip install maturin
          NML_BUILD_COMMIT=$GITHUB_SHA maturin build --release -i python -m core/nml-core-py/Cargo.toml -o dist
      - name: Upload the wheel for the test shards
        uses: actions/upload-artifact@v4
        with:
          name: nml-core-py-test
          path: dist/*.whl
          retention-days: 1
          if-no-files-found: error

  test:
    name: gdUnit4 Tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, core-linux, core-py-linux]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.not_core_only == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the core library (Build core for tests)
        uses: actions/download-artifact@v4
        with:
          name: nml-core-linux-test
          path: core/target/release

      - name: Install the core extension manifest
        run: touch core/target/.gdignore && bash core/install_gdextension.sh && test -f core/nml_core.gdextension

      - name: Setup Python (same minor as the nml_core wheel)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Download the nml_core wheel (Build nml_core python for tests)
        uses: actions/download-artifact@v4
        with:
          name: nml-core-py-test
          path: ${{ runner.temp }}/nml-core-py

      - name: Install nml_core and point the doctrine twin tests at it
        run: |
          pip install "$RUNNER_TEMP"/nml-core-py/*.whl
          echo "NML_DOCTRINE_PYO3_PYTHON=$(command -v python)" >> "$GITHUB_ENV"

      - name: Setup Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      # Asset blobs are content-addressed (sha256) and immutable, so the CDN cache dirs under
      # user:// (~/.local/share/godot/app_userdata/Niemandsland/ on the Linux runner) can be
      # restored across runs. Keyed by the pinned manifest the tests now use, so a warm run
      # downloads 0 blobs; a manifest change re-keys and re-downloads. One key per shard: each
      # shard fetches a different blob set, so a shared key would let one shard's save shadow the rest.
      # Self-healing: restore the newest entry by prefix (the "-restore" key never exists, so the
      # prefixes always apply), and at the end of the job (even on test failure) save a NEW entry
      # keyed by the content hash when the blob set grew. Shard reshuffles and blobs a cold run
      # never reached therefore converge instead of re-downloading forever.
      - name: Restore CDN asset blobs (content-addressed)
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.local/share/godot/app_userdata/Niemandsland/model_cache
            ~/.local/share/godot/app_userdata/Niemandsland/biome_cache
            ~/.local/share/godot/app_userdata/Niemandsland/ambience_cache
            ~/.local/share/godot/app_userdata/Niemandsland/containers_cache
            ~/.local/share/godot/app_userdata/Niemandsland/hazards_cache
            ~/.local/share/godot/app_userdata/Niemandsland/ruins_cache
            ~/.local/share/godot/app_userdata/Niemandsland/trees_cache
            ~/.local/share/godot/app_userdata/Niemandsland/reference_terrain_cache
          key: nml-asset-cache-v2-shard${{ matrix.shard }}-${{ hashFiles('assets/model_manifest.json') }}-restore
          restore-keys: |
            nml-asset-cache-v2-shard${{ matrix.shard }}-${{ hashFiles('assets/model_manifest.json') }}-
            nml-asset-cache-v2-shard${{ matrix.shard }}-

      - name: Hash restored CDN blobs
        id: blobs_before
        run: |
          mkdir -p ~/.local/share/godot/app_userdata/Niemandsland; cd ~/.local/share/godot/app_userdata/Niemandsland; H=$(find model_cache biome_cache ambience_cache containers_cache hazards_cache ruins_cache trees_cache reference_terrain_cache -type f ! -name '*.part' ! -name '*.tmp' -printf '%p %s\n' 2>/dev/null | LC_ALL=C sort | sha256sum | cut -c1-16)
          echo "hash=$H" >> "$GITHUB_OUTPUT"
          echo "restored blob set hash: $H"

      - name: Import project (generates .godot/, compile-check)
        run: godot --headless --editor --quit --path .

      # The shards must run with NmlCore loaded: fail here, before gdUnit, when the class is absent.
      - name: Gate - NmlCore loads in the test lane
        run: |
          godot --headless --path . -s res://tools/core_dormant_check.gd 2>&1 | tee /tmp/core_load.log
          python3 - <<'PY'
          import json, sys
          lines = [l for l in open("/tmp/core_load.log") if "NML_DORMANT_CHECK " in l]
          data = json.loads(lines[0].split("NML_DORMANT_CHECK ", 1)[1]) if lines else {}
          if data.get("class_present") is not True:
              print("::error::NmlCore did not load in the test lane")
              sys.exit(1)
          print("OK: NmlCore loaded in the test lane (class_present True)")
          PY

      # Each shard builds its own deterministic slice of the suite: sort every
      # *_test.gd under test/ (recursive, LC_ALL=C), then let tools/shard_assign.py split them into
      # shard_count (from the `changes` job) time-balanced slices, longest-processing-time-first
      # from test/shard_weights.json (a suite missing there gets the median weight). Time-balanced — not contiguous
      # blocks — spreads the slow test/e2e suites evenly across the runners.
      - name: Run gdUnit4 tests
        run: |
          set -o pipefail
          find test -name '*_test.gd' | LC_ALL=C sort > /tmp/all_suites.txt
          python3 tools/shard_assign.py --shards ${{ needs.changes.outputs.shard_count }} --index ${{ matrix.shard }} > /tmp/shard_suites.txt
          echo "shard ${{ matrix.shard }}: $(wc -l < /tmp/shard_suites.txt) suite(s) of $(wc -l < /tmp/all_suites.txt) total"
          ARGS=()
          while IFS= read -r suite; do
            ARGS+=(-a "res://${suite}")
          done < /tmp/shard_suites.txt
          godot --headless --path . \
            -s -d res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            --ignoreHeadlessMode -c "${ARGS[@]}" 2>&1 | tee gdunit_output.log

      # gdUnit prints "No test cases found, abort test run!" and exits 0 when a test file
      # fails to PARSE (syntax error) instead of failing to assert — a broken suite would
      # otherwise be a silent green on this gate, which every export/release job depends on.
      # A count check is cheap and can't be fooled by a parse error: fail if gdUnit reports
      # zero test cases, never prints its final summary, or executed fewer suites than THIS
      # shard's round-robin slice of the *_test.gd files on disk (recursive, includes
      # test/e2e, test/mp, ...). The "Shards cover every suite" job proves the
      # shard slices together still cover every file.
      - name: Verify gdUnit executed the full suite
        run: |
          CLEAN=$(sed -r 's/\x1b\[[0-9;]*m//g' gdunit_output.log)

          if grep -q "No test cases found" <<< "$CLEAN"; then
            echo "::error::gdUnit reported no test cases — a test file likely failed to parse"; exit 1
          fi

          if ! grep -q "^Overall Summary:" <<< "$CLEAN"; then
            echo "::error::gdUnit never printed its 'Overall Summary' line — run did not complete normally"; exit 1
          fi

          EXECUTED=$(grep -oP 'Executed test suites: \(\K[0-9]+' <<< "$CLEAN" | head -1)
          FILE_COUNT=$(python3 tools/shard_assign.py --shards ${{ needs.changes.outputs.shard_count }} --index ${{ matrix.shard }} | wc -l)
          echo "gdUnit executed suites: ${EXECUTED:-<none>} | this shard's *_test.gd files: $FILE_COUNT"

          if [ -z "$EXECUTED" ] || [ "$EXECUTED" -lt "$FILE_COUNT" ]; then
            echo "::error::gdUnit executed $EXECUTED suite(s) but shard ${{ matrix.shard }} owns $FILE_COUNT *_test.gd file(s) — some suite(s) never ran"; exit 1
          fi

      # Blobs are sha256-verified before the rename into the cache, so the set is safe to save
      # even when the tests failed. Partial downloads (*.part, *.tmp) are excluded from the hash.
      - name: Hash CDN blobs after tests
        id: blobs_after
        if: always()
        run: |
          mkdir -p ~/.local/share/godot/app_userdata/Niemandsland; cd ~/.local/share/godot/app_userdata/Niemandsland; H=$(find model_cache biome_cache ambience_cache containers_cache hazards_cache ruins_cache trees_cache reference_terrain_cache -type f ! -name '*.part' ! -name '*.tmp' -printf '%p %s\n' 2>/dev/null | LC_ALL=C sort | sha256sum | cut -c1-16)
          echo "hash=$H" >> "$GITHUB_OUTPUT"
          if [ "$H" = "${{ steps.blobs_before.outputs.hash }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "CDN blob set unchanged ($H) - skipping cache save"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "CDN blob set changed: ${{ steps.blobs_before.outputs.hash }} -> $H"
          fi

      # Main is the only writer: PR-scoped saves would churn the 10 GB repo cache and evict the Rust build caches.
      - name: Save CDN asset blobs (content-addressed)
        if: always() && steps.blobs_after.outputs.changed == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.local/share/godot/app_userdata/Niemandsland/model_cache
            ~/.local/share/godot/app_userdata/Niemandsland/biome_cache
            ~/.local/share/godot/app_userdata/Niemandsland/ambience_cache
            ~/.local/share/godot/app_userdata/Niemandsland/containers_cache
            ~/.local/share/godot/app_userdata/Niemandsland/hazards_cache
            ~/.local/share/godot/app_userdata/Niemandsland/ruins_cache
            ~/.local/share/godot/app_userdata/Niemandsland/trees_cache
            ~/.local/share/godot/app_userdata/Niemandsland/reference_terrain_cache
          key: nml-asset-cache-v2-shard${{ matrix.shard }}-${{ hashFiles('assets/model_manifest.json') }}-${{ steps.blobs_after.outputs.hash }}

  # Guard for the sharded gdUnit4 test job: recompute the same deterministic
  # assignment the shards use (tools/shard_assign.py --check), and fail unless every
  # *_test.gd under test/ lands in exactly one shard — this catches a future
  # test directory that quietly falls outside every shard.
  shards-coverage:
    name: Shards cover every suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the shards cover every *_test.gd suite
        run: |
          set -euo pipefail
          python3 tools/shard_assign.py --shards ${{ needs.changes.outputs.shard_count }} --check

      # tools/shard_assign_test.py reads the real test/ tree (the *_test.gd file list and
      # test/shard_weights.json): the balance check (max shard within 15 % of the mean) and the
      # real-tree coverage check. rust.yml runs it too, but only when its path filter matches;
      # weights and suite files change on most GDScript PRs, so the guard lives here, on every PR.
      - name: Shard assignment tests (balance and real-tree coverage)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest
          python3 -m pytest tools/shard_assign_test.py -q

  relay-tests:
    name: Relay tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install relay test deps
        run: pip install -r relay/requirements-dev.txt

      - name: Run relay tests (base + churn/soak)
        run: cd relay && python -m pytest -q

  # The one name branch protection requires (besides `hygiene`). It is green when every job it needs
  # is `success`, or `skipped` (the docs/tools fast lane skips the test shards). It runs with
  # `if: always()` so a failed or cancelled need shows up as a red check instead of a missing one.
  # Add every new gating job to `needs` below.
  all-required:
    name: All required checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, core-linux, core-py-linux, test, shards-coverage, relay-tests]
    if: always()
    steps:
      - name: Every required job is green or skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          bad = []
          for job, info in needs.items():
              result = info.get("result")
              print(f"{job}: {result}")
              if result not in ("success", "skipped"):
                  bad.append(f"{job}={result}")
          if bad:
              print("::error::required job(s) not green: " + ", ".join(bad))
              sys.exit(1)
          PY

  export-linux:
    name: Linux Export
    # glibc floor of the shipped Linux core: ubuntu-latest moved to glibc 2.43, players on 2.42 cannot load it
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [changes]
    # 30.10. (3.6 wave): draft PRs skip the exports - ~20 parallel builders queued 55 runs; the RED/GREEN
    # proof runs in the test jobs, and every PR gets this job once it is marked ready (and again on update-branch).
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'pull_request' || (needs.changes.outputs.not_core_only == 'true' && !github.event.pull_request.draft)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build the optional Rust core extension BEFORE the import, so the import sees
      # core/nml_core.gdextension + its .so and the Linux export carries them.
      - name: Build core extension (NmlCore)
        uses: ./.github/actions/build-core-extension
        with:
          target: linux

      - name: Gate - Linux core needs at most GLIBC 2.35
        run: tools/ci/check_glibc_floor.sh core/target/release/libnml_core_godot.so 2.35

      - name: Setup Godot (with export templates)
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: "true"

      - name: Import project (generates .godot/)
        run: godot --headless --editor --quit --path .

      # Dormant proof: installed -> class PRESENT + core_enabled FALSE; manifest moved
      # away -> class ABSENT. Both stamp sections must be byte-identical.
      - name: Dormant check (extension installed vs manifest moved away)
        run: |
          set -euo pipefail
          NML_DORMANT_STAMPS=/tmp/stamps_installed.json \
            godot --headless --path . -s res://tools/core_dormant_check.gd 2>&1 | tee /tmp/dormant_installed.log
          mv core/nml_core.gdextension /tmp/nml_core.gdextension.moved
          NML_DORMANT_STAMPS=/tmp/stamps_absent.json \
            godot --headless --path . -s res://tools/core_dormant_check.gd 2>&1 | tee /tmp/dormant_absent.log
          mv /tmp/nml_core.gdextension.moved core/nml_core.gdextension
          grep 'NML_DORMANT_CHECK ' /tmp/dormant_installed.log > /tmp/installed.marker
          grep 'NML_DORMANT_CHECK ' /tmp/dormant_absent.log > /tmp/absent.marker
          python3 -c 'import json; a=json.loads(open("/tmp/installed.marker").read().split("NML_DORMANT_CHECK ",1)[1]); b=json.loads(open("/tmp/absent.marker").read().split("NML_DORMANT_CHECK ",1)[1]); assert a["class_present"] and a["core_enabled"] is False, a; assert b["class_present"] is False, b; print("installed %s/%s absent %s" % (a["class_present"], a["core_enabled"], b["class_present"]))'
          diff /tmp/stamps_installed.json /tmp/stamps_absent.json
          echo "OK: the two stamp sections are byte-identical — the extension is dormant"

      - name: Stamp build hash
        run: sed -i "/^config\/version=/a config/build_hash=\"${GITHUB_SHA::7}\"" project.godot

      - name: Linux Build
        run: |
          mkdir -v -p build/linux
          godot --headless --verbose --export-release "Linux" build/linux/$EXPORT_NAME.x86_64

      # Godot copies the manifest's shared object flat next to the executable; the
      # runtime loader falls back to the exe dir when the res:// path does not exist.
      - name: Verify the extension library shipped next to the executable
        run: |
          ls -l build/linux
          test -f build/linux/libnml_core_godot.so || {
            echo "::error::libnml_core_godot.so did not land next to the exported executable"; exit 1; }

      # The debug-symbol file is a build artifact only; it must never leak into what players
      # download (export dir here, release zips in the tag-gated release job below).
      - name: Guard - no debug symbols in the export
        run: |
          if find build/linux -name '*.debug' -print -quit | grep -q .; then
            echo "::error::a debug-symbol file landed in the export directory"; exit 1
          fi
          echo "OK: no .debug file in build/linux"

      - name: Smoke-run the exported Linux build
        run: |
          set -o pipefail
          timeout 30 build/linux/$EXPORT_NAME.x86_64 --headless --quit-after 300 > /tmp/exported_run.log 2>&1 || true
          if grep -iE "GDExtension|SCRIPT ERROR|Parse Error" /tmp/exported_run.log; then
            echo "::error::the exported build reported an extension/script/parse error"; exit 1
          fi
          # The core must really load, not just ship: godot-rust's init line and the boot line of
          # update_checker.gd (CoreLoadNotice.boot_line) both have to be there.
          for LINE in "Initialize godot-rust" "core: NmlCore loaded"; do
            grep -qF "$LINE" /tmp/exported_run.log || {
              grep -F "core: NmlCore" /tmp/exported_run.log || true
              echo "::error::the exported build never printed '$LINE' - the core did not load"; exit 1; }
          done
          echo "OK: exported build started, loaded NmlCore, no GDExtension/script/parse errors"

      # Best-effort: a failed artifact upload (e.g. the account's Actions artifact-storage
      # quota is full) must not red-fail the export job. Releases use the self-contained
      # release job below, not these artifacts.
      - name: Upload Linux Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux

  export-windows:
    name: Windows Export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    # 30.10. (3.6 wave): draft PRs skip the exports - ~20 parallel builders queued 55 runs; the RED/GREEN
    # proof runs in the test jobs, and every PR gets this job once it is marked ready (and again on update-branch).
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'pull_request' || (needs.changes.outputs.not_core_only == 'true' && !github.event.pull_request.draft)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cross-build the Windows DLL before the import, so the Windows preset can
      # carry it; mingw-w64 also provides the objdump used for the import check.
      - name: Build core extension (NmlCore)
        uses: ./.github/actions/build-core-extension
        with:
          target: windows

      - name: Setup Godot (with export templates)
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: "true"

      - name: Import project (generates .godot/)
        run: godot --headless --editor --quit --path .

      - name: Stamp build hash
        run: sed -i "/^config\/version=/a config/build_hash=\"${GITHUB_SHA::7}\"" project.godot

      - name: Windows Build
        run: |
          mkdir -v -p build/windows
          godot --headless --verbose --export-release "Windows Desktop" build/windows/$EXPORT_NAME.exe

      - name: Verify the extension DLL shipped next to the executable
        run: |
          ls -l build/windows
          test -f build/windows/nml_core_godot.dll || {
            echo "::error::nml_core_godot.dll did not land next to the exported executable"; exit 1; }
          # The game data ships as its own file (embed_pck=false): the 0.3.14.0 .exe, with the game
          # data appended, was blocked as a virus by an antivirus heuristic on a Windows PC.
          test -f build/windows/$EXPORT_NAME.pck || {
            echo "::error::$EXPORT_NAME.pck did not land next to the exported executable"; exit 1; }

      # The debug-symbol file is a build artifact only; it must never leak into what players
      # download (export dir here, release zips in the tag-gated release job below).
      - name: Guard - no debug symbols in the export
        run: |
          if find build/windows -name '*.debug' -print -quit | grep -q .; then
            echo "::error::a debug-symbol file landed in the export directory"; exit 1
          fi
          echo "OK: no .debug file in build/windows"

      # The runner cannot start the .exe, so prove the DLL's imports instead: only
      # Windows system libraries, never the MinGW runtime a player would lack.
      - name: Verify the DLL imports only Windows system libraries
        run: |
          x86_64-w64-mingw32-objdump -p build/windows/nml_core_godot.dll | grep "DLL Name:"
          if x86_64-w64-mingw32-objdump -p build/windows/nml_core_godot.dll | grep -iE "libgcc_s|libstdc\+\+|libwinpthread"; then
            echo "::error::the DLL imports a MinGW runtime a player would lack"; exit 1
          fi
          echo "OK: no MinGW runtime imports"

      - name: Upload Windows Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows

  # macOS core + proof (maintainer decision, board D40, 26.09.2026). tract-linalg assembles hand-written
  # SIMD kernels per target and needs Apple's toolchain, so the Rust core is built natively on a macos-15
  # runner (both darwin triples, lipo'd into ONE universal dylib) and the macOS preset is exported and RUN
  # on the same runner. The job is green only when the exported, ad-hoc-signed .app loads NmlCore and plays
  # `opponent: erlkoenig` (tools/core_ship_probe.tscn, judged by tools/assert_ship_probe.py). The release
  # job ships THIS job's zip and requires it: a failed macOS core fails the whole release (one-core P1,
  # decision D2 reverses D40) - no platform ships without the core.
  export-macos:
    name: macOS Export (core + proof)
    runs-on: macos-15
    timeout-minutes: 60
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' || (needs.changes.outputs.macos_relevant == 'true' && !github.event.pull_request.draft) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Native build, lipo, strip, ad-hoc sign and guards; also installs core/nml_core.gdextension.
      - name: Build core extension (NmlCore, macOS universal)
        uses: ./.github/actions/build-core-extension
        with:
          target: macos

      - name: Setup Godot (with export templates)
        uses: ./.github/actions/setup-godot-macos
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: "true"

      - name: Import project (generates .godot/)
        run: godot --headless --editor --quit --path .

      # BSD sed has no GNU one-line `a` command; perl inserts the same line after config/version.
      - name: Stamp build hash
        run: |
          SHORT="${GITHUB_SHA::7}" perl -pi -e 'print "config/build_hash=\"$ENV{SHORT}\"\n" if $prev; $prev = /^config\/version=/;' project.godot

      - name: macOS Build (the bundle that ships)
        run: |
          set -euo pipefail
          mkdir -p build/macos build/logs
          godot --headless --verbose --export-release "macOS" build/macos/$EXPORT_NAME.zip
          unzip -q build/macos/$EXPORT_NAME.zip -d build/macos/bundle
          ls -l build/macos/bundle/*.app/Contents/MacOS build/macos/bundle/*.app/Contents/Frameworks

      # The headless export exits 0 even when it could not copy a manifest library (measured 26.09.: "Failed to
      # open '<dylib>'" and rc 0), so the bundle itself is what gets checked.
      - name: Verify the extension dylib shipped in Contents/Frameworks
        run: |
          set -euo pipefail
          APP=$(find build/macos/bundle -maxdepth 1 -name '*.app' | head -1)
          DYLIB="$APP/Contents/Frameworks/libnml_core_godot.dylib"
          test -f "$DYLIB" || {
            echo "::error::libnml_core_godot.dylib did not land in Contents/Frameworks of the exported app"; exit 1; }
          INFO=$(lipo -info "$DYLIB")
          echo "$INFO"
          if ! grep -q arm64 <<< "$INFO" || ! grep -q x86_64 <<< "$INFO"; then
            echo "::error::the shipped dylib is not universal (arm64 + x86_64)"; exit 1
          fi
          if ! cmp -s "$DYLIB" core/target/macos/libnml_core_godot.dylib; then
            echo "::warning::the exported dylib differs from the one the build produced — the export rewrote it"
          fi
          if find build/macos \( -name '*.debug' -o -name '*.dSYM' \) -print -quit | grep -q .; then
            echo "::error::a debug-symbol file landed in the export directory"; exit 1
          fi
          echo "OK: universal dylib in Contents/Frameworks, no debug symbols in build/macos"

      # An export template ignores `-s <script>` and a scene path on the command line (measured 26.09. on the
      # Linux export: no output / "compiled without support for path overrides"), so the proof bundle is a
      # SECOND export of the same preset whose main scene is the probe. Executable and dylib must be byte
      # for byte the shipping bundle's (compared before signing); only the .pck's project settings differ.
      - name: Export the proof bundle (same binaries, probe scene as main scene)
        run: |
          set -euo pipefail
          perl -pi -e 's|^run/main_scene=.*|run/main_scene="res://tools/core_ship_probe.tscn"|' project.godot
          grep -n '^run/main_scene' project.godot
          mkdir -p build/macos-probe
          godot --headless --verbose --export-release "macOS" build/macos-probe/$EXPORT_NAME.zip
          unzip -q build/macos-probe/$EXPORT_NAME.zip -d build/macos-probe/bundle
          SHIP=$(find build/macos/bundle -maxdepth 1 -name '*.app' | head -1)
          PROOF=$(find build/macos-probe/bundle -maxdepth 1 -name '*.app' | head -1)
          cmp "$SHIP/Contents/MacOS/$EXPORT_NAME" "$PROOF/Contents/MacOS/$EXPORT_NAME"
          cmp "$SHIP/Contents/Frameworks/libnml_core_godot.dylib" "$PROOF/Contents/Frameworks/libnml_core_godot.dylib"
          echo "OK: the proof bundle carries the shipping bundle's executable and dylib byte for byte"

      # Ad-hoc signature on BOTH bundles, the dylib first and the .app after (the bundle seal covers the
      # signed dylib). An arm64 Mac refuses code without a valid signature, so the runs below are only as
      # good as this step; the native codesign verifies what it made.
      - name: Ad-hoc sign both bundles and verify the signatures
        run: |
          set -euo pipefail
          for B in build/macos/bundle build/macos-probe/bundle; do
            APP=$(find "$B" -maxdepth 1 -name '*.app' | head -1)
            codesign --force --sign - --timestamp=none "$APP/Contents/Frameworks/libnml_core_godot.dylib"
            codesign --force --sign - --timestamp=none "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            codesign -dvv "$APP" 2>&1 | grep -E "Identifier|Signature|CodeDirectory" || true
          done

      # The Linux export's smoke step, on the shipping bundle: the real menu boots headless for 30 s with no
      # extension/script/parse error, and godot-rust announced itself (the dylib was loaded).
      - name: Smoke-run the shipping bundle (headless menu boot)
        run: |
          set -o pipefail
          APP=$(find build/macos/bundle -maxdepth 1 -name '*.app' | head -1)
          perl -e 'alarm shift; exec @ARGV' 30 "$APP/Contents/MacOS/$EXPORT_NAME" --headless --quit-after 300 > build/logs/exported_run.log 2>&1 || true
          cat build/logs/exported_run.log
          if grep -iE "GDExtension|SCRIPT ERROR|Parse Error" build/logs/exported_run.log; then
            echo "::error::the exported build reported an extension/script/parse error"; exit 1
          fi
          if ! grep -q "Initialize godot-rust" build/logs/exported_run.log; then
            echo "::error::the exported build never loaded the extension (no godot-rust init line)"; exit 1
          fi
          if ! grep -qF "core: NmlCore loaded" build/logs/exported_run.log; then
            echo "::error::the exported build never printed 'core: NmlCore loaded' - the core did not load"; exit 1
          fi
          echo "OK: exported build started, loaded the extension, no GDExtension/script/parse errors"

      # THE PROOF: the arm64 slice, natively. Exit code 0, NmlCore present, the packed net accepted, one real
      # planner pick through the core, and main.gd's own `opponent: erlkoenig` line.
      - name: Run the proof bundle (arm64) - NmlCore loads, the opponent is erlkoenig
        run: |
          set -o pipefail
          APP=$(find build/macos-probe/bundle -maxdepth 1 -name '*.app' | head -1)
          RC=0
          perl -e 'alarm shift; exec @ARGV' 300 "$APP/Contents/MacOS/$EXPORT_NAME" --headless > build/logs/probe_arm64.log 2>&1 || RC=$?
          echo "probe exit code: $RC"
          cat build/logs/probe_arm64.log
          python3 tools/assert_ship_probe.py build/logs/probe_arm64.log --os macOS --arch arm64 --exit-code "$RC"

      # Intel Macs: the x86_64 slice runs under Rosetta on the arm64 runner. Best effort — it does not gate the
      # job or the release: a slice that fails to load only means the decision tree on Intel, as before.
      - name: Run the proof bundle (x86_64 slice under Rosetta) - best effort
        continue-on-error: true
        run: |
          set -o pipefail
          sudo softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 /usr/bin/true
          APP=$(find build/macos-probe/bundle -maxdepth 1 -name '*.app' | head -1)
          RC=0
          perl -e 'alarm shift; exec @ARGV' 300 arch -x86_64 "$APP/Contents/MacOS/$EXPORT_NAME" --headless > build/logs/probe_x86_64.log 2>&1 || RC=$?
          echo "probe exit code: $RC"
          cat build/logs/probe_x86_64.log
          python3 tools/assert_ship_probe.py build/logs/probe_x86_64.log --os macOS --arch x86_64 --exit-code "$RC"

      # The release job unzips this file and hands it to players: build it the way the release job always
      # has (zip the .app's parent dir, symlinks kept) and verify the signature after a real extraction.
      - name: Package the macOS zip and re-verify it after extraction
        run: |
          set -euo pipefail
          rm -f build/macos/$EXPORT_NAME.zip
          (cd build/macos/bundle && zip -qry "../$EXPORT_NAME.zip" .)
          mkdir -p build/macos-verify
          unzip -q build/macos/$EXPORT_NAME.zip -d build/macos-verify
          APP=$(find build/macos-verify -maxdepth 1 -name '*.app' | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          ls -l build/macos/$EXPORT_NAME.zip

      # Tags: the release job consumes this zip, so a failed upload must fail THIS job (and with it the
      # release). Other runs: best effort, like the other export artifacts.
      - name: Upload macOS release zip
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: build/macos/${{ env.EXPORT_NAME }}.zip
          retention-days: 7
          if-no-files-found: error

      # The proof logs are what a maintainer without a Mac reads when this job goes red.
      - name: Upload proof logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: macos-proof-logs
          path: build/logs
          retention-days: 7
          if-no-files-found: ignore

  # Tag-only invocation of rust.yml's own job (as a reusable workflow) so the
  # release below can `needs` it — cross-workflow `needs` doesn't exist, and
  # rust.yml has no tag trigger of its own (tags don't touch main/PR). Every
  # non-tag push/PR is still covered by rust.yml running directly.
  rust-gate:
    name: Rust workspace checks (release gate)
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/rust.yml

  # Tag-gated: pushing a "v*" tag (e.g. v0.3.7-alpha) builds both platforms and
  # publishes them as a GitHub Release with permanent, public, direct download links.
  # Self-contained (builds its own Linux + Windows binaries) so it does NOT depend on the best-effort
  # Actions artifact upload, which can hit the account's artifact storage quota. The one exception is
  # the macOS zip with the Rust core, built and proven by export-macos (a macos-15 runner is the only
  # place that can build it): the release requires it and fails without it.
  release:
    name: Publish GitHub Release
    # glibc floor of the shipped Linux core: ubuntu-latest moved to glibc 2.43, players on 2.42 cannot load it
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # gdUnit (test), the relay suite, the Rust workspace checks and the macOS core export (built, signed
    # and proven) must all be green for the tagged sha before a release is built and published: the
    # implicit success() covers all four needs, so a failed macOS core fails the release (D2).
    needs: [test, relay-tests, rust-gate, export-macos]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    env:
      # Maintainer decision 25.09.2026: every release publishes as the current ("Latest") release,
      # alpha or not, so the GitHub page and "/releases/latest" show the newest build. The in-game
      # checker reads the list endpoint and is unaffected (docs/UPDATE_CHECK.md).
      IS_PRERELEASE: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The in-game updater compares the release TAG against the running config/version. A tag
      # ahead of project.godot ships a build that reports the old version, sees its own release
      # as newer and offers the same update on every start (rehearsed 22.09.2026). Fail fast.
      - name: Guard - the tag matches config/version in project.godot
        run: |
          V=$(grep -oP '^config/version="\K[^"]+' project.godot)
          if [ "${GITHUB_REF_NAME#v}" != "$V" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match config/version=\"${V}\" — updated players would be offered this release again on every start; bump project.godot first"; exit 1
          fi
          echo "OK: tag ${GITHUB_REF_NAME} matches config/version ${V}"

      # Build both libraries before the import: the Linux and Windows presets now
      # both admit the manifest, so each export carries its own library.
      - name: Build core extension (NmlCore, linux)
        uses: ./.github/actions/build-core-extension
        with:
          target: linux

      - name: Gate - Linux core needs at most GLIBC 2.35
        run: tools/ci/check_glibc_floor.sh core/target/release/libnml_core_godot.so 2.35

      - name: Build core extension (NmlCore, windows)
        uses: ./.github/actions/build-core-extension
        with:
          target: windows

      - name: Setup Godot (with export templates)
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: "true"

      - name: Import project (generates .godot/)
        run: godot --headless --editor --quit --path .

      - name: Stamp build hash
        run: sed -i "/^config\/version=/a config/build_hash=\"${GITHUB_SHA::7}\"" project.godot

      # The macOS zip WITH the Rust core, exported, signed and proven (loads NmlCore, plays erlkoenig) by the
      # export-macos job. Required: without it the build step below fails the release.
      - name: Fetch the proven macOS build
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: dist/macos-core

      - name: Build Linux + Windows + macOS
        run: |
          mkdir -p dist/linux dist/windows dist/macos
          godot --headless --verbose --export-release "Linux" dist/linux/$EXPORT_NAME.x86_64
          godot --headless --verbose --export-release "Windows Desktop" dist/windows/$EXPORT_NAME.exe
          test -f "dist/windows/$EXPORT_NAME.pck" || { echo "::error::the Windows release lacks $EXPORT_NAME.pck"; exit 1; }
          test -f "dist/macos-core/$EXPORT_NAME.zip" || { echo "::error::no proven macOS build with the core"; exit 1; }
          # The export-macos job's zip: universal core dylib in Contents/Frameworks, ad-hoc signed
          # (dylib first, then the .app) and run on a macos-15 runner before it was uploaded.
          cp "dist/macos-core/$EXPORT_NAME.zip" "dist/macos/$EXPORT_NAME.zip"

      # export-linux never runs on a tag, so the release smokes its own Linux build: it must boot and
      # load NmlCore (the same two lines export-linux requires).
      - name: Smoke-run the Linux release build - NmlCore loads
        run: |
          timeout 30 dist/linux/$EXPORT_NAME.x86_64 --headless --quit-after 300 > /tmp/release_run.log 2>&1 || true
          for LINE in "Initialize godot-rust" "core: NmlCore loaded"; do
            grep -qF "$LINE" /tmp/release_run.log || {
              grep -F "core: NmlCore" /tmp/release_run.log || true
              echo "::error::the Linux release build never printed '$LINE' - the core did not load"; exit 1; }
          done
          echo "OK: the Linux release build loaded NmlCore"

      - name: Guard - no debug symbols in the release tree
        run: |
          if find dist -name '*.debug' -print -quit | grep -q .; then
            echo "::error::a debug-symbol file landed in the release dist tree"; exit 1
          fi
          echo "OK: no .debug file in dist"

      - name: Package per-platform zips
        # Fixed names (no version): .../releases/latest/download/Niemandsland-<os>.zip stays valid across releases;
        # the in-game updater picks the asset by its OS keyword, so it is unaffected.
        run: |
          (cd dist/linux && zip -r "../Niemandsland-linux.zip" .)
          (cd dist/windows && zip -r "../Niemandsland-windows.zip" .)
          # The macOS export is already a .zip of the .app bundle — just give it the release name.
          cp "dist/macos/${EXPORT_NAME}.zip" "dist/Niemandsland-macos.zip"

      # No platform ships without the Rust core (tools/check_release_zip.py, one-core P1 step 12).
      - name: Guard - every zip carries the core
        run: |
          for OS in linux windows macos; do
            python3 tools/check_release_zip.py "dist/Niemandsland-$OS.zip" "$OS"
          done

      - name: Extract release notes (CHANGELOG section for this tag)
        # Match the section for THIS tag's version (e.g. v0.3.9.0-alpha -> "## [0.3.9.0-alpha]"),
        # not just the first "## [" heading — a "## [Unreleased]" placeholder above it would otherwise
        # be published as the (empty) release body. Fail loudly on a missing/empty section.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {f=1; print; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "ERROR: no CHANGELOG section found for $VERSION — refusing to publish blank release notes"
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Niemandsland ${{ github.ref_name }}
          body_path: release_notes.md
          prerelease: ${{ env.IS_PRERELEASE }}
          files: |
            dist/Niemandsland-linux.zip
            dist/Niemandsland-windows.zip
            dist/Niemandsland-macos.zip

      - name: Verify published prerelease metadata matches the tag
        # Self-check the softprops output rather than trusting the input echoed back: catches a
        # regression in the tag-name match above or a future softprops/action-gh-release change.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ACTUAL=$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isPrerelease -q .isPrerelease)
          if [ "$ACTUAL" != "$IS_PRERELEASE" ]; then
            echo "::error::published release isPrerelease=$ACTUAL but tag ${GITHUB_REF_NAME} expected IS_PRERELEASE=$IS_PRERELEASE"
            exit 1
          fi
          echo "OK: isPrerelease=$ACTUAL matches tag ${GITHUB_REF_NAME}"

      # Auto-update channel: push the desktop builds to itch.io so players who installed through the
      # itch desktop app get automatic updates (butler does delta updates per channel). Runs AFTER the
      # GitHub Release so that always ships first; skips cleanly until itch is configured via two repo
      # secrets (Settings > Secrets and variables > Actions):
      #   BUTLER_API_KEY  — an itch API key from https://itch.io/user/settings/api-keys
      #   ITCH_TARGET     — "your-itch-username/your-game-slug" (the project's page URL slug)
      - name: Push to itch.io (if configured)
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ secrets.ITCH_TARGET }}
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_TARGET" ]; then
            echo "itch.io not configured (BUTLER_API_KEY / ITCH_TARGET secrets unset) — skipping."
            exit 0
          fi
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          VERSION="${GITHUB_REF_NAME#v}"
          ./butler push dist/linux   "$ITCH_TARGET:linux"   --userversion "$VERSION"
          ./butler push dist/windows "$ITCH_TARGET:windows" --userversion "$VERSION"
          # macOS: push the extracted .app bundle so the itch app launches it directly.
          unzip -q "dist/macos/${EXPORT_NAME}.zip" -d dist/macos-app
          ./butler push dist/macos-app "$ITCH_TARGET:mac" --userversion "$VERSION"
