[package]
name = "nml-core-py"
version = "0.1.0"
edition = "2021"
publish = false
description = "NML-1073 M3-1: the Python seam — the Rust search, resolve and mission scoring as the extension module `nml_core`, so a harness can play self-play games without Godot."

[lib]
name = "nml_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
nmlcore = { package = "nml-core", path = "../nml-core" }

[profile.release]
opt-level = 3
