[package]
name = "nml-core-godot"
version = "0.1.0"
edition = "2021"
publish = false
build = "../nml-core-py/build.rs"
description = "NML-1073 M1-5: the GDExtension seam — the Rust rollout node (nml-core) callable from Godot as the RefCounted class NmlCore."

[lib]
# The rlib makes the runtime library a dependency of integration tests.
crate-type = ["cdylib", "rlib"]

[features]
default = []
onnx-tract = ["dep:tract-onnx", "dep:sha2"]
onnx-ort = ["dep:ort"]

[dependencies]
godot = { version = "0.5.5", features = ["api-4-6"] }
serde_json = "1"
nml-core = { path = "../nml-core" }
# Spike arms, off by default. ort links nothing at build time (load-dynamic);
# the official ONNX Runtime 1.28.0 library is loaded from NML_ORT_DYLIB.
tract-onnx = { version = "=0.23.7", optional = true }
sha2 = { version = "0.10", optional = true }
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["load-dynamic", "std"] }

[dev-dependencies]
# The optional [dependencies] sha2 is the loader's copy (tract feature only); this
# dev copy keeps the untouched ort golden target compiling under --features onnx-ort.
sha2 = "0.10"

[build-dependencies]
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }
