[package]
name = "nml-core-godot"
version = "0.1.0"
edition = "2021"
publish = false
description = "NML-1073 M1-5: the GDExtension seam — the Rust rollout node (nml-core) callable from Godot as the RefCounted class NmlCore."

[lib]
# The rlib makes the runtime library a dependency of integration tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
godot = { version = "0.5.5", features = ["api-4-6"] }
serde_json = "1"
nml-core = { path = "../nml-core" }
