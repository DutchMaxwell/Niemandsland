# External review 03.09. item F7: one Cargo workspace for the three core
# crates — ONE Cargo.lock and ONE shared target dir (core/target/) instead of
# three of each. The crates' manifests stay as they are; nothing moves.
[workspace]
members = ["nml-core", "nml-core-godot", "nml-core-py"]
resolver = "2"

# Carried from nml-core's pre-workspace manifest: release builds keep full
# debug info (the corpus tools symbolize backtraces through it). A workspace
# only honours profiles declared HERE; the per-member [profile.release] blocks
# (opt-level = 3, the release default anyway) were dropped with this file.
[profile.release]
debug = true
# Whole-program optimisation for OUR crates (the export .so, the Python wheel, the box wheels): the same R2 oracle games run
# ~6-7 % faster and use 4-8 % less CPU, bit-identical (parity gate on the box commit 345c2bcf). Dependencies keep the default
# 16 codegen units: one unit for tract made the export build peak above 9 GB at -j4 (7 GB without), the workspace-only
# setting costs +16 % build time and +9 % peak memory (see the PR that introduced these lines).
lto = "fat"
codegen-units = 1

[profile.release.package."*"]
codegen-units = 16
